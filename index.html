/* =========================================================
   DISCOUNT
   ========================================================= */

function getDiscountPercent(count) {

  if (count >= 5) return 30;

  if (count === 4) return 9;

  if (count === 3) return 6;

  if (count === 2) return 3;

  return 0;
}


/* =========================================================
   ЦЕНА
   ========================================================= */

function getPriceData() {

  const count =
    selected.size;

  const original =
    count * PRICE;

  const discountPercent =
    getDiscountPercent(count);

  const discount =
    Math.round(
      original *
      discountPercent /
      100
    );

  const freeApps =
    discountPercent === 30
      ? Math.floor(count * 0.3)
      : 0;

  const total =
    original - discount;

  return {
    count,
    original,
    discountPercent,
    discount,
    freeApps,
    total
  };
}


function updatePrice() {

  const data =
    getPriceData();

  if (selectedCount) {
    selectedCount.textContent =
      data.count;
  }

  if (priceValue) {
    priceValue.textContent =
      data.total.toLocaleString("ru-RU") +
      " ₽";
  }

  if (discountValue) {

    if (data.discount > 0) {

      discountValue.textContent =
        "−" +
        data.discount.toLocaleString("ru-RU") +
        " ₽";

    } else {

      discountValue.textContent =
        "−0 ₽";
    }
  }
}

/* =========================================================

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================================================
   ORDER LOCK — 1 МИНУТА
   ========================================================= */

function getOrderLock() {

  try {

    const saved =
      localStorage.getItem(
        ORDER_LOCK_KEY
      );

    if (!saved) {
      return null;
    }

    const data =
      JSON.parse(saved);

    if (
      !data ||
      !data.createdAt ||
      !data.order
    ) {

      localStorage.removeItem(
        ORDER_LOCK_KEY
      );

      return null;
    }

    if (
      Date.now() -
      data.createdAt >=
      ORDER_LOCK_TIME
    ) {

      localStorage.removeItem(
        ORDER_LOCK_KEY
      );

      return null;
    }

    return data;

  } catch (error) {

    console.log(
      "Order lock error:",
      error
    );

    return null;
  }
}


function saveOrderLock(order) {

  try {

    localStorage.setItem(
      ORDER_LOCK_KEY,
      JSON.stringify({
        createdAt: Date.now(),
        order
      })
    );

  } catch (error) {

    console.log(
      "Order lock save error:",
      error
    );
  }
}


function restoreOrderLock() {

  const lock =
    getOrderLock();

  if (!lock) {

    currentOrder = null;

    return;
  }

  currentOrder =
    lock.order;

  const remaining =
    ORDER_LOCK_TIME -
    (
      Date.now() -
      lock.createdAt
    );

  setTimeout(
    () => {

      localStorage.removeItem(
        ORDER_LOCK_KEY
      );

      currentOrder = null;

      showToast(
        "Можно создать новый заказ"
      );

    },
    Math.max(
      0,
      remaining
    )
  );
}


function hasActiveOrderLock() {

  const lock =
    getOrderLock();

  if (!lock) {

    currentOrder = null;

    return false;
  }

  currentOrder =
    lock.order;

  return true;
}

    paymentModal.addEventListener(
      "click",
      event => {

      }

    document.querySelectorAll(

  copyButtons.forEach(button => {

          await navigator.clipboard.writeText(

          );

        } catch {

          showToast(
            "Не удалось скопировать"
          );
        }
      }
    );
  });


  if (paymentDone) {

    paymentDone.addEventListener(
      "click",
      async () => {

        if (currentOrder) {

          closePaymentModal();

          showToast(
            "Заказ уже отправлен. Ожидайте проверки."
          );

          return;
        }

        await createOrder();
      }
    );
  }
}


/* =========================================================
   СОЗДАНИЕ ЗАКАЗА
   ========================================================= */

async function createOrder() {

  if (
    hasActiveOrderLock()
  ) {

    closePaymentModal();

    showToast(
      "Заказ уже создан. Ожидайте проверки."
    );

    return false;
  }


  if (isCreatingOrder) {

    showToast(
      "Заказ уже отправляется…"
    );

    return false;
  }


  if (selected.size === 0) {

    showToast(
      "Выберите хотя бы одно приложение"
    );

    return false;
  }


  const phone =
    paymentPhone
      ? paymentPhone.value.trim()
      : "";


  if (phone.length < 5) {

    showToast(
      "Введите номер телефона"
    );

    if (paymentPhone) {
      paymentPhone.focus();
    }

    return false;
  }


  const price =
    getPriceData();


  const selectedApps =
    apps.filter(
      app => selected.has(app.id)
    );


  const orderNumber =
    generateOrderNumber();


  const orderData = {

    order_number:
      orderNumber,

    client_phone:
      phone,

    app_ids:
      selectedApps.map(
        app => app.id
      ),

    apps:
      selectedApps.map(
        app => ({
          id: app.id,
          name: app.name,
          type: app.type
        })
      ),

    original:
      price.original,

    discount:
      price.discount,

    free_apps:
      price.freeApps,

    total:
      price.total,

    status:
      "awaiting_review"
  };


  isCreatingOrder = true;


  if (paymentDone) {

    paymentDone.disabled =
      true;

    paymentDone.textContent =
      "Сохраняем заказ…";
  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("orders")
        .insert([
          orderData
        ]);


    if (error) {

      console.error(
        "Supabase order error:",
        error
      );

      showToast(
        "Ошибка создания заказа"
      );

      return false;
    }


    currentOrder =
      orderData;


    saveOrderLock(
      orderData
    );


    saveClientOrder(
      orderNumber,
      phone
    );


    closePaymentModal();


    showToast(
      "Заказ " +
      orderNumber +
      " создан"
    );


    startOrderStatusPolling();


    return true;

  } catch (error) {

    console.error(
      error
    );

    showToast(
      "Ошибка соединения с сервером"
    );

    return false;

  } finally {

    isCreatingOrder =
      false;

    if (paymentDone) {

      paymentDone.disabled =
        false;

      paymentDone.textContent =
        "Я оплатил";
    }
  }
}


/* =========================================================
   НОМЕР ЗАКАЗА
   ========================================================= */

function generateOrderNumber() {

  const now =
    new Date();

  const day =
    String(
      now.getDate()
    ).padStart(2, "0");

  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const year =
    String(
      now.getFullYear()
    ).slice(-2);

  const hours =
    String(
      now.getHours()
    ).padStart(2, "0");

  const minutes =
    String(
      now.getMinutes()
    ).padStart(2, "0");

  const random =
    String(
      Math.floor(
        Math.random() * 100
      )
    ).padStart(
      2,
      "0"
    );

  return (
    "AC-" +
    year +
    month +
    day +
    "-" +
    hours +
    minutes +
    random
  );
}


/* =========================================================
   СТАТУС ЗАКАЗА
   ========================================================= */

async function checkOrderStatus() {

  const saved =
    getSavedClientOrder();

  if (!saved) {
    return;
  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "get_client_order_status",
        {
          p_order_number:
            saved.order_number,

          p_client_phone:
            saved.client_phone
        }
      );


    if (error) {

      console.error(
        "Order status error:",
        error
      );

      return;
    }


    if (
      !data ||
      data.length === 0
    ) {

      return;
    }


    const order =
      data[0];


    renderClientOrderStatus(
      order
    );


    if (
      order.status === "paid" ||
      order.status === "completed" ||
      order.status === "cancelled"
    ) {

      stopOrderStatusPolling();
    }

  } catch (error) {

    console.error(
      "Status check error:",
      error
    );
  }
}


/* =========================================================
   POLLING
   ========================================================= */

function startOrderStatusPolling() {

  stopOrderStatusPolling();

  checkOrderStatus();

  orderStatusTimer =
    setInterval(
      checkOrderStatus,
      7000
    );
}


function stopOrderStatusPolling() {

  if (
    orderStatusTimer
  ) {

    clearInterval(
      orderStatusTimer
    );

    orderStatusTimer =
      null;
  }
}

      <div style="
        font-size:22px;
        font-weight:800;
        margin-bottom:8px;
      ">
        ⏳ Заказ принят
      </div>

      <div style="
        opacity:.75;
        line-height:1.5;
      ">
        Номер заказа:
        <strong>
          ${escapeHtml(order.order_number)}
        </strong>
        <br>
        Ожидаем подтверждения оплаты.
      </div>

    `;

    return;
  }


  if (
    order.status ===
    "cancelled"
  ) {

    panel.style.display =
      "block";

    panel.innerHTML = `

      <div style="
        font-size:22px;
        font-weight:800;
        margin-bottom:8px;
      ">
        ❌ Заказ отменён
      </div>

      <div style="
        opacity:.75;
        line-height:1.5;
      ">
        Заказ
        <strong>
          ${escapeHtml(order.order_number)}
        </strong>
        был отменён.
      </div>

    `;

    return;
  }


  if (
    order.status === "paid" ||
    order.status === "completed"
  ) {

    renderInstallPanel(
      order
    );

    return;
  }
}


/* =========================================================
   УСТАНОВКА ПРИЛОЖЕНИЙ
   ========================================================= */

function renderInstallPanel(
  order
) {

  const panel =
    getInstallPanel();


  panel.style.display =
    "block";


  const orderedApps =
    Array.isArray(order.apps)
      ? order.apps
      : [];


  const orderedIds =
    new Set(
      orderedApps.map(
        item => item.id
      )
    );


  const installApps =
    apps.filter(
      app =>
        orderedIds.has(app.id)
    );


  panel.innerHTML = `

    <div style="
      font-size:24px;
      font-weight:900;
      margin-bottom:8px;
    ">
      ✅ Оплата подтверждена
    </div>

    <div style="
      opacity:.75;
      line-height:1.5;
      margin-bottom:18px;
    ">
      Заказ
      <strong>
        ${escapeHtml(order.order_number)}
      </strong>
      подтверждён.
      <br>
      Установите приложения из вашего заказа.
    </div>

    <div
      id="appcoreInstallList"
      style="
        display:flex;
        flex-direction:column;
        gap:10px;
      "
    ></div>

    <button
      type="button"
      id="allAppsInstalledButton"
      style="
        width:100%;
        margin-top:18px;
        border:0;
        border-radius:16px;
        padding:15px 16px;
        font-size:15px;
        font-weight:800;
        cursor:pointer;
        background:#ffffff;
        color:#111111;
      "
    >
      ✅ Все приложения установлены
    </button>

    <div
      id="installationNextStep"
      style="
        display:none;
        margin-top:16px;
        padding:16px;
        border-radius:16px;
        background:rgba(255,255,255,.06);
        line-height:1.5;
        opacity:.9;
      "
    >
      Отлично! Все приложения отмечены как установленные.
      <br><br>
      Следующим шагом здесь появится инструкция
      с 10 фотографиями по настройке приложений.
    </div>

  `;


  const list =
    panel.querySelector(
      "#appcoreInstallList"
    );


  installApps.forEach(
    app => {

      const row =
        document.createElement("div");


      row.style.display =
        "flex";

      row.style.alignItems =
        "center";

      row.style.gap =
        "12px";

      row.style.padding =
        "12px";

      row.style.borderRadius =
        "16px";

      row.style.background =
        "rgba(255,255,255,.05)";


      row.innerHTML = `

        <div style="
          width:42px;
          height:42px;
          border-radius:12px;
          display:flex;
          align-items:center;
          justify-content:center;
          background:rgba(255,255,255,.08);
          font-size:21px;
          flex:none;
        ">
          ${app.icon}
        </div>

        <div style="
          flex:1;
          min-width:0;
        ">
          <div style="
            font-weight:800;
            margin-bottom:3px;
          ">
            ${escapeHtml(app.name)}
          </div>

          <div style="
            font-size:12px;
            opacity:.55;
          ">
            Приложение оплачено
          </div>
        </div>

        <a
          href="${app.installUrl}"
          target="_blank"
          rel="noopener noreferrer"
          style="
            display:inline-flex;
            align-items:center;
            justify-content:center;
            padding:10px 14px;
            border-radius:12px;
            background:#ffffff;
            color:#111111;
            text-decoration:none;
            font-size:13px;
            font-weight:800;
            flex:none;
          "
        >
          Установить
        </a>

      `;


      list.appendChild(
        row
      );
    }
  );


  const installedButton =
    panel.querySelector(
      "#allAppsInstalledButton"
    );


  const nextStep =
    panel.querySelector(
      "#installationNextStep"
    );


  installedButton.addEventListener(
    "click",
    () => {

      installedButton.textContent =
        "✅ Все приложения установлены";

      installedButton.disabled =
        true;

      installedButton.style.opacity =
        ".6";

      nextStep.style.display =
        "block";

      showToast(
        "Отлично! Переходим к настройке."
      );

      /*
        Здесь позже будет запуск
        инструкции с 10 фотографиями.
      */
    }
  );
}


/* =========================================================
   ВОССТАНОВЛЕНИЕ СТАТУСА ПРИ ОБНОВЛЕНИИ
   ========================================================= */

function restoreClientOrderStatus() {

  const saved =
    getSavedClientOrder();

  if (!saved) {
    return;
  }

  startOrderStatusPolling();
}


/* =========================================================
   TELEGRAM
   ========================================================= */

function initTelegram() {

  try {

    if (
      window.Telegram &&
      window.Telegram.WebApp
    ) {

      const tg =
        window.Telegram.WebApp;

      tg.ready();

      tg.expand();

    }

  } catch (error) {

    console.log(
      "Telegram init error:",
      error
    );
  }
}


/* =========================================================
   КНОПКА "НАЗАД"
   ========================================================= */

function setupBackButton() {

  const backButton =
    document.querySelector(
      "[data-back]"
    );

  if (!backButton) {
    return;
  }

  backButton.addEventListener(
    "click",
    () => {

      if (
        paymentModal &&
        paymentModal.style.display === "flex"
      ) {

        closePaymentModal();

        return;
      }

      window.history.back();
    }
  );
}


/* =========================================================
   ИНИЦИАЛИЗАЦИЯ
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    restoreOrderLock();

    setupCategories();

    setupSearch();

    setupPaymentModal();

    setupBackButton();

    render();

    updatePrice();

    initTelegram();

    restoreClientOrderStatus();

  }
);
</script>
