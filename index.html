<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0b12">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>AppCore</title>

<style>
:root {
  --bg: #08090d;
  --card: #12141b;
  --text: #ffffff;
  --muted: #8d93a3;
  --line: rgba(255,255,255,.08);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 0%, rgba(91,70,255,.13), transparent 32%),
    radial-gradient(circle at 100% 15%, rgba(0,200,255,.08), transparent 28%),
    var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    Arial,
    sans-serif;
  padding-bottom: 150px;
}

body.no-scroll {
  overflow: hidden;
}

button,
input {
  font: inherit;
}

button {
  -webkit-appearance: none;
}

.container {
  width: 100%;
  max-width: 920px;
  margin: 0 auto;
  padding: 18px 15px 30px;
}

/* HEADER */

.header {
  margin-bottom: 18px;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}

.brand-logo {
  width: 43px;
  height: 43px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  font-weight: 900;
  color: white;
  background:
    linear-gradient(135deg, #7557ff, #4b31d9);
  box-shadow: 0 8px 28px rgba(93,65,255,.28);
}

.brand-title {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -.5px;
}

.online {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 11px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.035);
  border-radius: 20px;
  color: #b5bac7;
  font-size: 12px;
}

.online-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #37db7c;
  box-shadow: 0 0 10px rgba(55,219,124,.7);
}

h1 {
  margin: 27px 0 7px;
  font-size: clamp(30px, 8vw, 44px);
  line-height: 1;
  letter-spacing: -1.7px;
}

.subtitle {
  max-width: 650px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
}

/* DISCOUNT */

.discount-box {
  margin-top: 18px;
  padding: 15px;
  border-radius: 18px;
  background:
    linear-gradient(
      135deg,
      rgba(118,83,255,.18),
      rgba(0,180,255,.08)
    );
  border: 1px solid rgba(135,109,255,.22);
  overflow: hidden;
  position: relative;
}

.discount-box::after {
  content: "";
  position: absolute;
  width: 130px;
  height: 130px;
  right: -45px;
  top: -65px;
  border-radius: 50%;
  background: rgba(110,80,255,.16);
  filter: blur(2px);
}

.discount-title {
  position: relative;
  z-index: 1;
  font-size: 14px;
  font-weight: 800;
}

.discount-text {
  position: relative;
  z-index: 1;
  margin-top: 5px;
  color: #aeb4c4;
  font-size: 12px;
  line-height: 1.45;
}

.discount-highlight {
  color: #b69cff;
  font-weight: 800;
}

/* SEARCH */

.search-wrap {
  margin-top: 17px;
  position: relative;
}

.search {
  width: 100%;
  height: 49px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: rgba(18,20,27,.94);
  color: white;
  outline: none;
  padding: 0 44px 0 43px;
  font-size: 14px;
  transition: .2s;
}

.search:focus {
  border-color: rgba(135,109,255,.4);
  box-shadow: 0 0 0 3px rgba(117,83,255,.07);
}

.search::placeholder {
  color: #656b7a;
}

.search-icon {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: #858b99;
  font-size: 20px;
  z-index: 2;
}

.clear {
  display: none;
  position: absolute;
  right: 8px;
  top: 7px;
  width: 35px;
  height: 35px;
  border: 0;
  border-radius: 10px;
  background: rgba(255,255,255,.06);
  color: #aeb4c0;
  cursor: pointer;
}

/* CATEGORIES */

.categories {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 13px 1px 3px;
}

.categories::-webkit-scrollbar {
  display: none;
}

.category {
  flex: 0 0 auto;
  height: 36px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255,255,255,.035);
  color: #9298a7;
  cursor: pointer;
  font-size: 12px;
  font-weight: 650;
  transition: .2s;
}

.category.active {
  color: #fff;
  border-color: rgba(126,98,255,.42);
  background: linear-gradient(
    135deg,
    rgba(110,77,255,.28),
    rgba(73,52,170,.2)
  );
}

/* GRID */

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 16px;
}

/* APP CARD */

.app-card {
  min-height: 165px;
  padding: 14px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,.07);
  background: #12141a;
  transition:
    transform .18s ease,
    border-color .18s ease,
    box-shadow .18s ease;
}

.app-card::before {
  content: "";
  position: absolute;
  width: 110px;
  height: 110px;
  right: -50px;
  top: -50px;
  border-radius: 50%;
  background: var(--app-color);
  opacity: .13;
  filter: blur(3px);
}

.app-card:active {
  transform: scale(.975);
}

.app-card.selected {
  border-color: var(--app-color);
  box-shadow:
    0 0 0 1px var(--app-color),
    0 12px 35px rgba(0,0,0,.25);
}

/* APP ICON */

.app-icon {
  position: relative;
  z-index: 1;
  width: 50px;
  height: 50px;
  border-radius: 15px;
  background: var(--app-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(0,0,0,.22);
}

.app-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.fallback {
  color: white;
  font-size: 16px;
  font-weight: 900;
}

/* CHECK */

.check {
  position: absolute;
  z-index: 3;
  right: 11px;
  top: 11px;
  width: 25px;
  height: 25px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(0,0,0,.22);
  display: flex;
  align-items: center;
  justify-content: center;
  color: transparent;
  font-size: 13px;
  font-weight: 900;
}

.app-card.selected .check {
  color: #111;
  background: white;
  border-color: white;
}

/* APP INFO */

.app-name {
  position: relative;
  z-index: 1;
  margin-top: 13px;
  padding-right: 22px;
  font-size: 14px;
  font-weight: 800;
  line-height: 1.25;
}

.app-type {
  position: relative;
  z-index: 1;
  margin-top: 5px;
  color: #777e8c;
  font-size: 11px;
}

/* EMPTY */

.empty {
  display: none;
  padding: 65px 20px;
  text-align: center;
}

.empty.show {
  display: block;
}

.empty-icon {
  width: 52px;
  height: 52px;
  margin: 0 auto 13px;
  border-radius: 17px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,.05);
  color: #737a89;
  font-size: 22px;
}

.empty-title {
  font-size: 16px;
  font-weight: 800;
}

.empty-text {
  margin-top: 6px;
  color: #707785;
  font-size: 13px;
}

/* BOTTOM PANEL */

.bottom {
  position: fixed;
  z-index: 20;
  left: 0;
  right: 0;
  bottom: 0;
  padding:
    10px 14px
    calc(11px + env(safe-area-inset-bottom));
  background:
    linear-gradient(
      to top,
      rgba(8,9,13,1) 55%,
      rgba(8,9,13,.96) 76%,
      rgba(8,9,13,0)
    );
}

.bottom-inner {
  width: 100%;
  max-width: 920px;
  margin: 0 auto;
}

/* PRICE */

.price-panel {
  display: none;
  margin-bottom: 9px;
  padding: 12px 14px;
  border-radius: 17px;
  background: rgba(20,22,29,.97);
  border: 1px solid rgba(255,255,255,.08);
  backdrop-filter: blur(20px);
}

.price-panel.visible {
  display: block;
}

.price-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.price-label {
  color: #858c9a;
  font-size: 12px;
}

.price-value {
  color: #fff;
  font-size: 13px;
  font-weight: 700;
}

.total-row {
  margin-top: 7px;
  padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,.06);
}

.total-row .price-label {
  color: #fff;
  font-weight: 700;
}

.total-row .price-value {
  font-size: 17px;
}

.sale {
  color: #55e18b !important;
}

/* BUTTON */

.continue {
  width: 100%;
  height: 52px;
  border: 0;
  border-radius: 16px;
  background: linear-gradient(135deg, #ffffff, #e9e9ee);
  color: #090a0e;
  font-size: 15px;
  font-weight: 850;
  cursor: pointer;
  box-shadow: 0 8px 25px rgba(0,0,0,.22);
  transition: .18s;
}

.continue:disabled {
  opacity: .38;
  box-shadow: none;
}

.continue:not(:disabled):active {
  transform: scale(.985);
}

/* TOAST */

.toast {
  position: fixed;
  z-index: 200;
  left: 50%;
  bottom: 155px;
  transform: translate(-50%, 20px);
  max-width: calc(100% - 30px);
  padding: 11px 15px;
  border-radius: 13px;
  background: #242731;
  border: 1px solid rgba(255,255,255,.09);
  color: #fff;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: .22s;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ==========================================
   PAYMENT MODAL
========================================== */

.payment-modal {
  position: fixed;
  z-index: 100;
  inset: 0;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 15px;
  background: rgba(0,0,0,.72);
  backdrop-filter: blur(10px);
}

.payment-modal.show {
  display: flex;
}

.payment-card {
  width: 100%;
  max-width: 520px;
  position: relative;
  padding: 22px;
  border-radius: 24px;
  background: #15171f;
  border: 1px solid rgba(255,255,255,.1);
  box-shadow: 0 20px 70px rgba(0,0,0,.5);
  animation: paymentUp .22s ease;
}

@keyframes paymentUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.payment-close {
  position: absolute;
  right: 14px;
  top: 14px;
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 10px;
  background: rgba(255,255,255,.07);
  color: #aaa;
  font-size: 22px;
  cursor: pointer;
}

.payment-title {
  font-size: 21px;
  font-weight: 850;
  padding-right: 40px;
}

.payment-subtitle {
  margin-top: 6px;
  color: #858c9a;
  font-size: 13px;
}

.payment-subtitle strong {
  color: #fff;
}

.payment-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-top: 18px;
  padding: 15px;
  border-radius: 16px;
  background: rgba(255,255,255,.05);
}

.payment-total span {
  color: #8d93a3;
  font-size: 13px;
}

.payment-total strong {
  font-size: 21px;
}

.payment-details {
  margin-top: 12px;
  padding: 4px 14px;
  border-radius: 16px;
  background: rgba(255,255,255,.035);
}

.payment-detail {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  min-height: 53px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}

.payment-detail:last-child {
  border-bottom: 0;
}

.payment-detail span {

}

.payment-detail strong {

}
