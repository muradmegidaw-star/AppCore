<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppCore — Админ-панель</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #fff;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin-top: 0;
    }

    .card {
      background: #151b23;
      border: 1px solid #27303b;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input,
    button,
    select {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 9px;
      border: 1px solid #303a47;
      font-size: 16px;
    }

    input,
    select {
      background: #0f141b;
      color: #fff;
    }

    button {
      background: #fff;
      color: #000;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .logout {
      width: auto;
      float: right;
      margin-top: 0;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #ff7070;
      margin-top: 12px;
    }

    .order {
      background: #0f141b;
      border: 1px solid #27303b;
      border-radius: 12px;
      padding: 16px;
      margin-top: 14px;
    }

    .order.new-order {
      border-color: #6ee7a0;
      box-shadow: 0 0 0 1px rgba(110, 231, 160, .15);
    }

    .order-row {
      margin: 7px 0;
    }

    .order-number {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .apps {
      color: #b9c3d0;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .status-select {
      margin-top: 12px;
    }

    .refresh {
      width: auto;
      margin-top: 0;
      margin-bottom: 15px;
    }

    .notification-button {
      width: auto;
      margin-top: 0;
      margin-bottom: 15px;
      background: #6ee7a0;
      color: #07140c;
      border: none;
    }

    .notification-button.enabled {
      background: #27303b;
      color: #fff;
    }

    .notification {
      background: #18251e;
      border: 1px solid #6ee7a0;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      display: none;
    }

    .notification.show {
      display: block;
    }

    .notification-title {
      font-weight: bold;
      margin-bottom: 7px;
    }

    .notification-text {
      color: #c8d4cc;
      font-size: 14px;
      line-height: 1.5;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .paid-button {
      background: #6ee7a0;
      color: #07140c;
      border: none;
    }

    .complete-button {
      background: #fff;
      color: #000;
      border: none;
    }

    .cancel-button {
      background: #ff5c5c;
      color: #fff;
      border: none;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .loading {
      color: #aeb8c5;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 10px;
      margin-bottom: 15px;
    }

    .filters input,
    .filters select {
      margin-top: 0;
    }

    .orders-count {
      color: #aeb8c5;
      margin-top: 10px;
      font-size: 14px;
    }

    .cancelled {
      opacity: .7;
    }

    @media (max-width: 650px) {
      .filters {
        grid-template-columns: 1fr;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .notification-button,
      .refresh {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginScreen" class="card">

    <h1>AppCore</h1>

    <h2>Вход в админ-панель</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Пароль"
      autocomplete="current-password"
    >

    <button id="loginButton">
      Войти
    </button>

    <div id="loginMessage"></div>

  </div>


  <!-- ADMIN -->
  <div id="adminScreen" class="hidden">

    <div class="card">

      <div class="top">

        <div>
          <h1>AppCore — Заказы</h1>
          <div id="userEmail"></div>
        </div>

        <button
          id="logoutButton"
          class="logout"
        >
          Выйти
        </button>

      </div>

    </div>


    <div class="card">

      <button
        id="notificationButton"
        class="notification-button"
        type="button"
      >
        🔔 Включить уведомления
      </button>

      <div
        id="notification"
        class="notification"
      >
        <div
          id="notificationTitle"
          class="notification-title"
        >
          🛒 Новый заказ
        </div>

        <div
          id="notificationText"
          class="notification-text"
        ></div>
      </div>


      <button
        id="refreshButton"
        class="refresh"
      >
        Обновить заказы
      </button>


      <div class="filters">

        <input
          id="searchInput"
          type="text"
          placeholder="Поиск по номеру или телефону"
        >

        <select id="statusFilter">

          <option value="all">
            Все статусы
          </option>

          <option value="awaiting_review">
            Ожидает проверки
          </option>

          <option value="paid">
            Оплачен
          </option>

          <option value="completed">
            Выполнен
          </option>

          <option value="cancelled">
            Отменён
          </option>

        </select>

      </div>


      <div
        id="ordersCount"
        class="orders-count"
      ></div>


      <div id="orders">

        <div class="loading">
          Загрузка...
        </div>

      </div>

    </div>

  </div>

</div>


<script>

  const SUPABASE_URL =
    "https://dkgipfotfjntlhabakns.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_Yqtu6SOTncAsze5_whAAFQ_KjTUbK_6";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let allOrders = [];

  let notificationInterval = null;

  let notificationInitialized = false;

  let knownOrderIds = new Set();


  const loginScreen =
    document.getElementById("loginScreen");

  const adminScreen =
    document.getElementById("adminScreen");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const loginButton =
    document.getElementById("loginButton");

  const logoutButton =
    document.getElementById("logoutButton");

  const refreshButton =
    document.getElementById("refreshButton");

  const loginMessage =
    document.getElementById("loginMessage");

  const ordersContainer =
    document.getElementById("orders");

  const userEmail =
    document.getElementById("userEmail");

  const searchInput =
    document.getElementById("searchInput");

  const statusFilter =
    document.getElementById("statusFilter");

  const ordersCount =
    document.getElementById("ordersCount");

  const notificationButton =
    document.getElementById("notificationButton");

  const notification =
    document.getElementById("notification");

  const notificationTitle =
    document.getElementById("notificationTitle");

  const notificationText =
    document.getElementById("notificationText");


  // =========================
  // ВХОД
  // =========================

  loginButton.addEventListener(
    "click",
    async () => {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      loginMessage.className = "";
      loginMessage.textContent = "";


      if (!email || !password) {

        loginMessage.className = "error";

        loginMessage.textContent =
          "Введите email и пароль.";

        return;
      }


      loginButton.disabled = true;

      loginButton.textContent =
        "Вход...";


      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });


      loginButton.disabled = false;

      loginButton.textContent =
        "Войти";


      if (error) {

        loginMessage.className = "error";

        loginMessage.textContent =
          "Ошибка входа: " +
          error.message;

        return;
      }


      showAdmin(data.user);

    }
  );


  // =========================
  // ВЫХОД
  // =========================

  logoutButton.addEventListener(
    "click",
    async () => {

      stopNewOrderChecker();

      await supabaseClient.auth.signOut();

      showLogin();

    }
  );


  // =========================
  // УВЕДОМЛЕНИЯ
  // =========================

  notificationButton.addEventListener(
    "click",
    async () => {

      if (
        !("Notification" in window)
      ) {

        alert(
          "Этот браузер не поддерживает уведомления."
        );

        return;
      }


      const permission =
        await Notification.requestPermission();


      if (
        permission === "granted"
      ) {

        notificationButton.textContent =
          "🔔 Уведомления включены";

        notificationButton.classList.add(
          "enabled"
        );

        showToastNotification(
          "AppCore",
          "Уведомления о новых заказах включены."
        );

      } else {

        alert(
          "Разрешение на уведомления не предоставлено."
        );

      }

    }
  );


  function showToastNotification(
    title,
    message
  ) {

    if (
      "Notification" in window &&
      Notification.permission === "granted"
    ) {

      new Notification(
        title,
        {
          body: message,
          icon: "https://muradmegidaw-star.github.io/AppCore/favicon.ico"
        }
      );

    }

  }


  function showNewOrderNotification(
    order
  ) {

    const appsText =
      Array.isArray(order.apps)
        ? order.apps
            .map(app => {

              if (
                typeof app === "string"
              ) {
                return app;
              }

              if (
                app &&
                app.name
              ) {
                return app.name;
              }

              return JSON.stringify(app);

            })
            .join(", ")

        : String(
            order.apps || ""
          );


    notificationTitle.textContent =
      "🛒 Новый заказ " +
      (order.order_number || "");


    notificationText.innerHTML =
      "<strong>Телефон:</strong> " +
      escapeHtml(
        order.client_phone || "—"
      ) +
      "<br>" +
      "<strong>Приложения:</strong> " +
      escapeHtml(appsText) +
      "<br>" +
      "<strong>Сумма:</strong> " +
      Number(order.total || 0) +
      " ₽";


    notification.classList.add(
      "show"
    );


    if (
      "Notification" in window &&
      Notification.permission === "granted"
    ) {

      new Notification(
        "🛒 Новый заказ AppCore",
        {
          body:
            (order.order_number || "Новый заказ") +
            "\n" +
            (order.client_phone || "") +
            "\n" +
            "Сумма: " +
            Number(order.total || 0) +
            " ₽"
        }
      );

    }


    setTimeout(
      () => {
        notification.classList.remove(
          "show"
        );
      },
      10000
    );

  }


  // =========================
  // ПРОВЕРКА НОВЫХ ЗАКАЗОВ
  // =========================

  function startNewOrderChecker() {

    stopNewOrderChecker();


    notificationInterval =
      setInterval(
        checkForNewOrders,
        10000
      );

  }


  function stopNewOrderChecker() {

    if (
      notificationInterval
    ) {

      clearInterval(
        notificationInterval
      );

      notificationInterval = null;

    }

  }


  async function checkForNewOrders() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", {
          ascending: false
        });


    if (error) {
      return;
    }


    const orders =
      data || [];


    if (
      !notificationInitialized
    ) {

      orders.forEach(
        order => {

          if (order.id) {
            knownOrderIds.add(
              order.id
            );
          }

        }
      );


      notificationInitialized =
        true;

      return;
    }


    const newOrders =
      orders.filter(
        order =>
          order.id &&
          !knownOrderIds.has(
            order.id
          )
      );


    orders.forEach(
      order => {

        if (order.id) {
          knownOrderIds.add(
            order.id
          );
        }

      }
    );


    if (
      newOrders.length === 0
    ) {
      return;
    }


    newOrders
      .reverse()
      .forEach(
        order => {

          showNewOrderNotification(
            order
          );

        }
      );


    allOrders =
      orders;


    renderFilteredOrders();

  }


  // =========================
  // СЕССИЯ
  // =========================

  async function checkSession() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (
      session &&
      session.user
    ) {

      showAdmin(
        session.user
      );

    } else {

      showLogin();

    }

  }


  function showLogin() {

    stopNewOrderChecker();

    loginScreen.classList.remove(
      "hidden"
    );

    adminScreen.classList.add(
      "hidden"
    );

    emailInput.value = "";

    passwordInput.value = "";

  }


  function showAdmin(user) {

    loginScreen.classList.add(
      "hidden"
    );

    adminScreen.classList.remove(
      "hidden"
    );

    userEmail.textContent =
      "Вы вошли как: " +
      user.email;

    loadOrders();

    notificationInitialized =
      false;

    knownOrderIds =
      new Set();

    startNewOrderChecker();

  }


  // =========================
  // ЗАГРУЗКА ЗАКАЗОВ
  // =========================

  async function loadOrders() {

    ordersContainer.innerHTML =
      '<div class="loading">Загрузка заказов...</div>';

    ordersCount.textContent = "";


    const {
      data,
      error
    } =
      await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      ordersContainer.innerHTML =
        '<div class="error">Ошибка загрузки: ' +
        escapeHtml(error.message) +
        '</div>';

      return;
    }


    allOrders =
      data || [];


    renderFilteredOrders();

  }


  // =========================
  // ФИЛЬТРАЦИЯ
  // =========================

  function renderFilteredOrders() {

    const search =
      searchInput.value
        .trim()
        .toLowerCase();


    const selectedStatus =
      statusFilter.value;


    const filtered =
      allOrders.filter(
        order => {

          const orderNumber =
            String(
              order.order_number || ""
            ).toLowerCase();


          const phone =
            String(
              order.client_phone || ""
            ).toLowerCase();


          const matchesSearch =
            !search ||
            orderNumber.includes(search) ||
            phone.includes(search);


          const matchesStatus =
            selectedStatus === "all" ||
            order.status === selectedStatus;


          return (
            matchesSearch &&
            matchesStatus
          );

        }
      );


    ordersCount.textContent =
      "Найдено заказов: " +
      filtered.length;


    ordersContainer.innerHTML = "";


    if (
      filtered.length === 0
    ) {

      ordersContainer.innerHTML =
        '<div class="loading">' +
        'Заказов по заданным условиям нет.' +
        '</div>';

      return;
    }


    filtered.forEach(
      order => {

        renderOrder(
          order
        );

      }
    );

  }


  // =========================
  // ОТОБРАЖЕНИЕ ЗАКАЗА
  // =========================

  function renderOrder(
    order
  ) {

    const element =
      document.createElement(
        "div"
      );


    element.className =
      "order";


    if (
      order.status ===
      "cancelled"
    ) {

      element.classList.add(
        "cancelled"
      );

    }


    const appsText =
      Array.isArray(order.apps)

        ? order.apps
            .map(
              app => {

                if (
                  typeof app ===
                  "string"
                ) {

                  return app;

                }


                if (
                  app &&
                  app.name
                ) {

                  return app.name;

                }


                return JSON.stringify(
                  app
                );

              }
            )
            .join(", ")

        : JSON.stringify(
            order.apps || []
          );


    const date =
      order.created_at
        ? new Date(
            order.created_at
          ).toLocaleString(
            "ru-RU"
          )
        : "—";


    element.innerHTML = `

      <div class="order-number">
        Заказ:
        ${escapeHtml(
          order.order_number ||
          "—"
        )}
      </div>


      <div class="order-row">
        <strong>Телефон:</strong>
        ${escapeHtml(
          order.client_phone ||
          "—"
        )}
      </div>


      <div class="order-row">
        <strong>Приложения:</strong>

        <div class="apps">
          ${escapeHtml(
            appsText
          )}
        </div>
      </div>


      <div class="order-row">
        <strong>Сумма:</strong>
        ${Number(
          order.total || 0
        )} ₽
      </div>


      <div class="order-row">
        <strong>Скидка:</strong>
        ${Number(
          order.discount || 0
        )} ₽
      </div>


      <div class="order-row">
        <strong>Дата:</strong>
        ${escapeHtml(
          date
        )}
      </div>


      <select class="status-select">

        <option
          value="awaiting_review"
          ${
            order.status ===
            "awaiting_review"
              ? "selected"
              : ""
          }
        >
          Ожидает проверки
        </option>


        <option
          value="paid"
          ${
            order.status ===
            "paid"
              ? "selected"
              : ""
          }
        >
          Оплачен
        </option>


        <option
          value="completed"
          ${
            order.status ===
            "completed"
              ? "selected"
              : ""
          }
        >
          Выполнен
        </option>


        <option
          value="cancelled"
          ${
            order.status ===
            "cancelled"
              ? "selected"
              : ""
          }
        >
          Отменён
        </option>

      </select>


      ${
        order.status !==
          "paid" &&
        order.status !==
          "completed" &&
        order.status !==
          "cancelled"

          ? `

            <div class="actions">

              <button
                class="paid-button"
                type="button"
              >
                💳 Оплата подтверждена
              </button>

            </div>

          `

          : ""
      }


      ${
        order.status ===
        "paid"

          ? `

            <div class="actions">

              <button
                class="complete-button"
                type="button"
              >
                ✅ Заказ выполнен
              </button>

            </div>

          `

          : ""
      }


      ${
        order.status !==
          "cancelled" &&
        order.status !==
          "completed"

          ? `

            <button
              class="cancel-button"
              type="button"
            >
              Отменить заказ
            </button>

          `

          : ""
      }

    `;


    // =========================
    // SELECT СТАТУСА
    // =========================

    const select =
      element.querySelector(
        ".status-select"
      );


    select.addEventListener(
      "change",
      async () => {

        const newStatus =
          select.value;


        const oldStatus =
          order.status;


        select.disabled =
          true;


        const {
          error
        } =
          await supabaseClient
            .from("orders")
            .update({
              status:
                newStatus
            })
            .eq(
              "id",
              order.id
            );


        select.disabled =
          false;


        if (error) {

          alert(
            "Не удалось изменить статус:\n" +
            error.message
          );


          select.value =
            oldStatus;


          return;
        }


        order.status =
          newStatus;


        renderFilteredOrders();

      }
    );


    // =========================
    // ОПЛАТА
    // =========================

    const paidButton =
      element.querySelector(
        ".paid-button"
      );


    if (paidButton) {

      paidButton.addEventListener(
        "click",
        async () => {

          const confirmed =
            confirm(
              "Вы проверили перевод и подтверждаете оплату заказа " +
              order.order_number +
              "?"
            );


          if (!confirmed) {
            return;
          }


          paidButton.disabled =
            true;


          paidButton.textContent =
            "Сохранение...";


          const {
            error
          } =
            await supabaseClient
              .from("orders")
              .update({
                status:
                  "paid"
              })
              .eq(
                "id",
                order.id
              );


          if (error) {

            paidButton.disabled =
              false;


            paidButton.textContent =
              "💳 Оплата подтверждена";


            alert(
              "Не удалось подтвердить оплату:\n" +
              error.message
            );


            return;
          }


          order.status =
            "paid";


          renderFilteredOrders();

        }
      );

    }


    // =========================
    // ЗАКАЗ ВЫПОЛНЕН
    // =========================

    const completeButton =
      element.querySelector(
        ".complete-button"
      );


    if (completeButton) {

      completeButton.addEventListener(
        "click",
        async () => {

          const confirmed =
            confirm(
              "Отметить заказ " +
              order.order_number +
              " как выполненный?"
            );


          if (!confirmed) {
            return;
          }


          completeButton.disabled =
            true;


          completeButton.textContent =
            "Сохранение...";


          const {
            error
          } =
            await supabaseClient
              .from("orders")
              .update({
                status:
                  "completed"
              })
              .eq(
                "id",
                order.id
              );


          if (error) {

            completeButton.disabled =
              false;


            completeButton.textContent =
              "✅ Заказ выполнен";


            alert(
              "Не удалось завершить заказ:\n" +
              error.message
            );


            return;
          }


          order.status =
            "completed";


          renderFilteredOrders();

        }
      );

    }


    // =========================
    // ОТМЕНА
    // =========================

    const cancelButton =
      element.querySelector(
        ".cancel-button"
      );


    if (cancelButton) {

      cancelButton.addEventListener(
        "click",
        async () => {

          const confirmed =
            confirm(
              "Отменить заказ " +
              order.order_number +
              "?"
            );


          if (!confirmed) {
            return;
          }


          cancelButton.disabled =
            true;


          cancelButton.textContent =
            "Отмена...";


          const {
            error
          } =
            await supabaseClient
              .from("orders")
              .update({
                status:
                  "cancelled"
              })
              .eq(
                "id",
                order.id
              );


          if (error) {

            cancelButton.disabled =
              false;


            cancelButton.textContent =
              "Отменить заказ";


            alert(
              "Не удалось отменить заказ:\n" +
              error.message
            );


            return;
          }


          order.status =
            "cancelled";


          renderFilteredOrders();

        }
      );

    }


    ordersContainer.appendChild(
      element
    );

  }


  // =========================
  // ПОИСК
  // =========================

  searchInput.addEventListener(
    "input",
    renderFilteredOrders
  );


  // =========================
  // ФИЛЬТР
  // =========================

  statusFilter.addEventListener(
    "change",
    renderFilteredOrders
  );


  // =========================
  // ОБНОВИТЬ
  // =========================

  refreshButton.addEventListener(
    "click",
    loadOrders
  );


  // =========================
  // ЗАЩИТА HTML
  // =========================

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  // =========================
  // ЗАПУСК
  // =========================

  checkSession();

</script>

</body>
</html>
